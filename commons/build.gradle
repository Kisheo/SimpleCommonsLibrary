apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "kotlin-kapt"
apply plugin: "kotlin-parcelize"
apply plugin: "maven-publish"

// Set group and version so the artifact coordinates match the ones the consuming app expects
group = 'com.github.Kisheo'
version = 'b4c2de1'

android {
    compileSdk = 36

    defaultConfig {
        minSdk = propMinSdkVersion
        targetSdk = propTargetSdkVersion
    }

    // Enable View Binding to replace kotlin synthetic view accessors
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    // Use Java 17 compatibility for compilation (stable target for Kotlin/Android)
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Add flavor dimension and product flavors to match the consuming app
    flavorDimensions "licensing"
    productFlavors {
        proprietary {}
        foss {}
        prepaid {}
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            consumerProguardFiles "proguard-rules.pro"
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }
    namespace = 'com.dpsoftapps.commons'
}

// Ensure Kotlin compilation uses a known JVM target (set jvmTarget for Kotlin tasks)
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
        // keep API/IR defaults
    }
}

dependencies {
    // removed external PatternLockView and RtlViewPager dependencies (vendor stubs are provided locally)
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.exifinterface:exifinterface:1.4.2"
    // use a stable biometric artifact available on google()/mavenCentral()
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "com.googlecode.ez-vcard:ez-vcard:0.12.2"

    api "joda-time:joda-time:2.14.1"
    api "com.github.tibbi:RecyclerView-FastScroller:5a95285b1f"
    api "com.github.tibbi:reprint:2cb206415d"
    api "androidx.core:core-ktx:1.9.0"
    api "androidx.appcompat:appcompat:1.7.1"
    api "com.google.android.material:material:1.8.0"
    api "com.google.code.gson:gson:2.14.0"

    api "com.github.bumptech.glide:glide:4.14.2"
    kapt "com.github.bumptech.glide:compiler:4.14.2"

    api "androidx.room:room-runtime:2.8.1"
    kapt "androidx.room:room-compiler:2.8.1"
}

// Publishing configuration: create a Maven publication for the AAR and publish to mavenLocal when requested.
// This allows the host app to resolve the dependency using mavenLocal() with the coordinates above.
afterEvaluate {
    publishing {
        publications {
            // Create a single publication for the release AAR (sufficient for local testing).
            // This avoids using the deprecated android.libraryVariants API which can cause deprecation warnings
            // and is brittle with newer AGP versions.
            create("mavenAar", MavenPublication) {
                // pick the release component if available, fallback to debug
                if (components.findByName('release') != null) {
                    from components.release
                } else if (components.findByName('debug') != null) {
                    from components.debug
                }

                groupId = project.group
                artifactId = 'SimpleCommonsLibrary'
                version = project.version
            }
        }
        repositories {
            mavenLocal()
        }
    }
}
