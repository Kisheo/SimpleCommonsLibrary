// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        propCompileSdkVersion = 36
        propMinSdkVersion = 23
        propTargetSdkVersion = propCompileSdkVersion
        propVersionCode = 1
        propVersionName = '5.34.26'
        kotlin_version = '2.1.20'
    }

    repositories {
        google()
        // include jcenter as read-only fallback for legacy artifacts the project depends on
        // jcenter() // deprecated, kept commented; prefer mavenCentral()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.3'
        // Align Kotlin plugin to 2.1.20 to match newer library artifacts in the dependency graph
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        // prefer local maven first so published libraries can be resolved by consuming projects
        mavenLocal()
        google()
        // jcenter() // deprecated
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
