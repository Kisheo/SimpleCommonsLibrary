apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk = propCompileSdkVersion

    defaultConfig {
        applicationId "com.dpsoftapps.commons"
        minSdk = propMinSdkVersion
        targetSdk = propTargetSdkVersion
        versionCode propVersionCode
        versionName propVersionName
        vectorDrawables.useSupportLibrary = true
        // Choose a default value for the 'licensing' flavor dimension used by the commons module
        missingDimensionStrategy 'licensing', 'foss'
    }

    // Explicit: keep buildConfig generation enabled to avoid AGP deprecation
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    namespace = 'com.dpsoftapps.commons.samples'
}

// Ensure Kotlin uses a compatible JVM target
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':commons')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
}
